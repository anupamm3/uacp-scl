# ── Providers Configuration ──────────────────────────────────────────
# Default settings and capabilities per provider.
# ──────────────────────────────────────────────────────────────────

providers:
  gemini:
    api_key_env: "GEMINI_API_KEY"
    capabilities:
      supports_native_schema: true
      supports_system_role: true
      max_context: 1048576

  groq:
    base_url: "https://api.groq.com/openai/v1"
    api_key_env: "GROQ_API_KEY"
    capabilities:
      supports_native_schema: true
      supports_system_role: true
      max_context: 131072

  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    capabilities:
      supports_native_schema: true
      supports_system_role: true
      max_context: 131072

  ollama:
    base_url: "http://localhost:11434/v1"
    api_key_env: null
    capabilities:
      supports_native_schema: false
      supports_system_role: true
      max_context: 32768

# ── Model Aliases ────────────────────────────────────────────────
# Each alias maps to a provider, a model id, and rate-limit metadata.
#
# ⚠  PLACEHOLDER model IDs below — replace them with current values from:
#    • Gemini  : https://ai.google.dev/gemini-api/docs/models
#    • Groq    : https://console.groq.com/docs/models
#    • Ollama  : https://ollama.com/library
#
# The "fake" alias is used by tests and never calls a real API.
# ──────────────────────────────────────────────────────────────────

aliases:
  alpha_default:
    provider: gemini
    model_id: "gemini-2.0-flash"      # e.g. gemini-2.0-flash
    limits:
      requests_per_minute: 15
      tokens_per_minute: 1_000_000
      daily_requests: 1500

  beta_default:
    provider: groq
    model_id: "openai/gpt-oss-20b"        # e.g. openai/gpt-oss-20b or openai/gpt-oss-120b
    limits:
      requests_per_minute: 30
      tokens_per_minute: 6000
      daily_requests: 14400

  local_default:
    provider: ollama
    model_id: "PLACEHOLDER_OLLAMA_MODEL"      # e.g. llama3.2
    limits:
      requests_per_minute: 120
      tokens_per_minute: 100_000
      daily_requests: null                    # no cloud limit

  fake:
    provider: fake
    model_id: "fake-echo-v1"
    limits:
      requests_per_minute: 999
      tokens_per_minute: 999_999
      daily_requests: null
