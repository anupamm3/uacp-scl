[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uacp"]

[project]
name = "uacp-scl"
version = "0.1.0"
description = "Unified Agent Communication Protocol & Semantic Context Layer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "UACP-SCL Contributors" }]
keywords = ["llm", "agents", "protocol", "scl", "uacp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2",
    "jsonschema",
    "httpx",
    "typer",
    "rich",
    "pyyaml",
    "python-dotenv",
    "structlog",
    "numpy",
]

[project.optional-dependencies]
gemini = ["google-genai"]
openai-compat = ["openai"]
server = ["fastapi", "uvicorn"]
ui = ["streamlit"]
embeddings = ["sentence-transformers", "networkx"]
redis = ["redis", "fakeredis"]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "hypothesis",
    "syrupy",
    "ruff",
    "mypy",
]

[project.scripts]
scl = "uacp.cli:scl_app"
uacp = "uacp.cli:uacp_app"

# ── Ruff ──────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "SIM",       # flake8-simplify
    "RUF",       # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["uacp"]

# ── Mypy ──────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["uacp.scl.*", "uacp.protocol.*"]
disallow_untyped_defs = true
strict = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ── Pytest ────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring live services",
    "e2e: marks end-to-end tests",
]
